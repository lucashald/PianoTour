<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PianoTour SVG Mockup</title>
    <style>
        :root {
            --bg-dark: #222;
            --bg-panel: #333;
            --text-light: #eee;
            --accent-blue: #4a90e2;
            --accent-hover: #357abd;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        /* --- CORE SVG ICON STYLING --- */
        /* This is the most important part. 
           It sizes the icons and ensures they inherit text color. */
        .icon {
            width: 1.2em; /* Scales relative to font size */
            height: 1.2em;
            vertical-align: middle; /*Aligns nicely with text */
            fill: currentColor; /* The magic sauce: inherits text color */
            margin-right: 6px; /* Spacing between icon and text */
        }

        /* Slightly larger icons for main controls if desired */
        .icon-large {
            width: 1.4em;
            height: 1.4em;
        }
        /* --------------------------- */


        /* Basic Layout Styling for the Mockup */
        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 10px;
            background: var(--bg-panel);
            border-radius: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            background: #444;
            border: 1px solid #555;
            color: var(--text-light);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        /* Demonstrating color inheritance */
        .btn-primary {
            background: var(--accent-blue);
            border: none;
        }
        .btn-primary:hover {
             background: var(--accent-hover);
        }


        .main-container {
            display: flex;
            gap: 20px;
        }

        .sidebar {
            flex: 0 0 250px;
            background: var(--bg-panel);
            padding: 15px;
            border-radius: 8px;
        }

        .panel-section {
            margin-bottom: 20px;
            border-bottom: 1px solid #444;
            padding-bottom: 15px;
        }

        .panel-title {
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }

        .transpose-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .note-display {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            background: var(--bg-panel);
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

    </style>
</head>
<body>

    <div class="toolbar">
        <h3>PianoTour</h3>
        
        <button class="btn-primary">
            <svg class="icon icon-large" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            Play Score
        </button>

        <button>
            <svg class="icon icon-large" viewBox="0 0 24 24">
                <path d="M6 6h12v12H6z"/>
            </svg>
            Stop
        </button>

        <button>
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 7h2v7H6zm3 0h2v7H9zm3 0h2v7h-2zm3 0h2v7h-2z"/>
            </svg>
            Connect MIDI
        </button>

        <button>
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
            Export Audio
        </button>
    </div>

    <div class="note-display">
        0

        </svg>
    </div>


    <div class="main-container">
        <div class="sidebar">
            
            <div class="panel-section">
                <span class="panel-title">ADSR Envelope</span>
                <div style="font-size: 0.9em; color: #aaa;">(Controls here...)</div>
            </div>

            <div class="panel-section">
                <span class="panel-title">Transpose Score</span>
                <div class="transpose-grid">
                    
                    <button>
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M12 4l-7 7h5v9h4v-9h5z"/>

                        Semitone
                    </button>
                    
                    <button>
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M4 20h16v2H4zM12 2l-8 9h5v7h6v-7h5z"/>

                        Octave
                    </button>

                    <button>
                         <svg class="icon" viewBox="0 0 24 24">
                            <path d="M12 20l7-7h-5V4h-4v9H5z"/>

                        Semitone
                    </button>

                    <button>
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M4 2h16v2H4zM12 22l8-9h-5V6h-6v7H5z"/>
                        </svg>
                        Octave
                    </button>
                </div>
            </div>
            
             <div class="panel-section" style="border:none">
                <button style="width: 100%; justify-content: center;">Clear Score</button>
