      /* Guitar Color Settings - Using project color palette */
      --guitar-body: #7f4427;           /* Main body color (blue-darkest) */
      --guitar-body-detail: #143E58;    /* Body detail (blue-dark) */
      --guitar-neck: #895718;           /* Neck color (blue-medium) */
      --guitar-bridge: #895718;         /* Bridge and sound hole outer (gold-dark) */
      --guitar-soundhole: #030505;      /* Sound hole inner (gold-darkest) */
      --guitar-hardware: #463015;       /* Tuning hardware (gold-medium) */
      --guitar-pegs: #895718;           /* Tuning pegs (gold-dark) */
      --guitar-bridge-pins: #5E3401;    /* Bridge pins (gold-darkest) */
      --guitar-frets: #b2b2b2;          /* Frets (peach-medium/danger) */
      --guitar-fret-markers: #6F91A5;   /* Fret markers (blue-lightest) */

      /* Interactive String Colors */
      --string-resting: #797d86;        /* String color when not vibrating (blue-light) */
      --string-active: #aab2c6;         /* String color when vibrating (gold-light) */
      --string-nodes: #467089;          /* Color of node circles (blue-light) */
      --string-ticks: #6F91A5;          /* Color of tick marks (blue-lightest) */
    }

    html, body {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0px;
      left: 0px;
      margin: 0px;
      overflow: hidden;
      background-color: #f5f5f5;
    }

    #guitar-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 800px;
      height: auto;
      z-index: 1;
      pointer-events: none;
    }

    #guitar-svg {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0.9;
    }

    #main-layer, #canvas0 {
      position: absolute;
      top: 0px;
      left: 0px;
      height: 100%;
      width: 100%;
      z-index: 2;
    }

    #iOSTap {
      position: absolute;
      top: 0px;
      left: 0px;
      height: 100%;
      width: 100%;
      background-color: rgba(255, 0, 255, 0.3);
      z-index: 999;
    }

  <script>
    // Custom guitar string positioning
    // Guitar string positions in SVG coordinates (viewBox 0 0 496.2 496.2)
    // Evenly spaced: 23.8 units span / 5 gaps = 4.76 units between strings
    const guitarStringsSVG = [
      { x: 234.2, yTop: 62.7, yBottom: 408.9 },   // String 1 (leftmost/thickest)
      { x: 239.0, yTop: 49.6, yBottom: 408.6 },   // String 2
      { x: 243.7, yTop: 36.7, yBottom: 408.9 },   // String 3
      { x: 248.5, yTop: 36.6, yBottom: 408.9 },   // String 4
      { x: 253.2, yTop: 49.4, yBottom: 408.6 },   // String 5
      { x: 258.0, yTop: 62.9, yBottom: 408.6 }    // String 6 (rightmost/thinnest)
    ];

    // Function to convert SVG coordinates to screen coordinates
    function svgToScreen(svgX, svgY) {
      const guitarContainer = document.getElementById('guitar-container');
      const guitarSvg = document.getElementById('guitar-svg');
      const containerRect = guitarContainer.getBoundingClientRect();

      // SVG viewBox dimensions
      const svgWidth = 496.2;
      const svgHeight = 496.2;

      // Convert to ratio (0-1) within the SVG
      const ratioX = svgX / svgWidth;
      const ratioY = svgY / svgHeight;

      // Convert to screen coordinates (accounting for retina scaling * 2)
      const screenX = (containerRect.left + ratioX * containerRect.width) * 2;
      const screenY = (containerRect.top + ratioY * containerRect.height) * 2;

      return { x: screenX, y: screenY };
    }

    // Helper function to parse CSS color to RGBA array
    function parseCSSColor(cssColor) {
      // Create a temporary element to parse the color
      const temp = document.createElement('div');
      temp.style.color = cssColor;
      document.body.appendChild(temp);
      const computed = window.getComputedStyle(temp).color;
      document.body.removeChild(temp);

      // Parse rgb(r, g, b) or rgba(r, g, b, a)
      const match = computed.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
      if (match) {
        return [
          parseInt(match[1]),
          parseInt(match[2]),
          parseInt(match[3]),
          match[4] ? parseFloat(match[4]) : 1.0
        ];
      }
      return [102, 102, 102, 1.0]; // fallback to grey
    }

    // Override the ThreadController's methods
    window.addEventListener('load', function() {
      if (typeof m !== 'undefined') {
        // Get CSS variables for colors
        const rootStyles = getComputedStyle(document.documentElement);
        const stringRestingColor = parseCSSColor(rootStyles.getPropertyValue('--string-resting').trim());
        const stringActiveColor = parseCSSColor(rootStyles.getPropertyValue('--string-active').trim());
        const nodeColor = parseCSSColor(rootStyles.getPropertyValue('--string-nodes').trim());
        const tickColor = parseCSSColor(rootStyles.getPropertyValue('--string-ticks').trim());

        // Apply colors to ThreadController
        m.nodeColor = nodeColor;
        m.tickColor = tickColor;

        // Disable tick marks drawing
        m.redrawTicks = function() {
          // Do nothing - we don't want tick marks on a guitar
        };

        // Disable node circles drawing
        m.redrawNodes = function() {
          // Do nothing - we have bridge pins in the SVG instead
        };

        // Override setThreadPositions to use guitar string positions
        m.setThreadPositions = function() {
          // Position strings based on actual guitar string positions
          for (let i = 0; i < guitarStringsSVG.length && i < this.arrThreadPositions.length; i++) {
            const stringData = guitarStringsSVG[i];
            const topPos = svgToScreen(stringData.x, stringData.yTop);
            const bottomPos = svgToScreen(stringData.x, stringData.yBottom);

            this.arrThreadPositions[i][0][0] = topPos.x;
            this.arrThreadPositions[i][0][1] = topPos.y;
            this.arrThreadPositions[i][1][0] = bottomPos.x;
            this.arrThreadPositions[i][1][1] = bottomPos.y;
          }
        };

        // Remove extra threads - the harmonic formula creates 11, we only want 6
        while (m.arrThreads.length > guitarStringsSVG.length) {
          m.arrThreads.pop();
        }

        // Make strings thinner and apply CSS colors
        for (let i = 0; i < m.arrThreads.length; i++) {
          m.arrThreads[i].strokeSize = 2 * 2; // Reduced from 3 * 2
          m.arrThreads[i].col0 = stringRestingColor; // Resting color
          m.arrThreads[i].col1 = stringActiveColor;  // Active/vibrating color
          m.arrThreads[i].col = stringRestingColor.slice(); // Current color
        }

        // Update positions now
        m.updateSizeAndPosition();
      }
    });

    // Update on window resize
    window.addEventListener('resize', function() {
      if (typeof m !== 'undefined' && m.updateSizeAndPosition) {
        setTimeout(function() {
          m.updateSizeAndPosition();
        }, 50);
      }
    });
  </script>
