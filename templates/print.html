<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Score - Piano Tour</title>

    <!-- VexFlow Library -->
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>

    <style>
        /* ==========================================================================
           Print-Optimized Styles
           ========================================================================== */

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: white;
            color: black;
            padding: 0;
            margin: 0;
        }

        /* Page container for screen preview */
        .page-container {
            max-width: 8.5in;
            margin: 0 auto;
            background: white;
            padding: 0.75in;
            min-height: 11in;
        }

        /* Header Section */
        .score-header {
            margin-bottom: 0.5in;
            border-bottom: 2px solid #000;
            padding-bottom: 0.25in;
        }

        .score-title {
            font-size: 24pt;
            font-weight: bold;
            margin-bottom: 8pt;
            text-align: center;
            border: 1px dashed transparent;
            padding: 4px;
            cursor: text;
        }

        .score-title:hover {
            border-color: #ccc;
        }

        .score-title:focus {
            outline: 2px solid #297B51;
            border-color: #297B51;
        }

        .score-metadata {
            display: flex;
            justify-content: space-between;
            font-size: 11pt;
            margin-top: 8pt;
        }

        .metadata-left,
        .metadata-center,
        .metadata-right {
            flex: 1;
        }

        .metadata-center {
            text-align: center;
        }

        .metadata-right {
            text-align: right;
        }

        /* Score Content */
        .score-content {
            margin: 0.25in 0;
        }

        /* System (line of music) container */
        .score-system {
            margin-bottom: 0.2in;
            page-break-inside: avoid;
        }

        .score-system svg {
            display: block;
            margin: 0;
        }

        /* Individual score SVG */
        #score {
            width: 100%;
            overflow: visible;
        }

        /* Footer */
        .score-footer {
            margin-top: 0.5in;
            padding-top: 0.25in;
            border-top: 1px solid #666;
            font-size: 9pt;
            color: #666;
            text-align: center;
        }

        /* Loading/Error States */
        .message {
            padding: 1in;
            text-align: center;
            font-size: 14pt;
        }

        .error {
            color: #c00;
        }

        /* Print-specific styles */
        @media print {
            body {
                margin: 0;
                padding: 0;
            }

            .page-container {
                max-width: 100%;
                margin: 0;
                padding: 0.5in;
            }

            .score-system {
                page-break-inside: avoid;
            }

            /* Force page breaks between pages if needed */
            .page-break {
                page-break-before: always;
            }

            /* Hide elements not needed in print */
            .no-print {
                display: none !important;
            }

            @page {
                size: letter portrait;
                margin: 0.5in;
            }
        }

        /* Screen-only controls */
        .print-controls {
            position: fixed;
            top: 10px;
            right: 10px;
            background: white;
            padding: 10px;
            border: 2px solid #333;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .print-btn {
            background: #297B51;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 8px;
        }

        .print-btn:hover {
            background: #1f5f3d;
        }

        .print-btn.secondary {
            background: #666;
        }

        .print-btn.secondary:hover {
            background: #444;
        }

        /* Chord diagram row (below each system) */
        .chord-diagram-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 6px 0 10px 20px;
        }

        .chord-diagram {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .chord-diagram-label {
            font-size: 8pt;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        @media print {
            .print-controls {
                display: none;
            }

            .score-title {
                border: none !important;
                cursor: default;
            }

            .score-title:hover {
                border-color: transparent;
            }
        }
    </style>
</head>
<body>
    <!-- Print Controls (hidden when printing) -->
    <div class="print-controls no-print">
        <button class="print-btn" onclick="window.print()">🖨️ Print</button>
        <button class="print-btn secondary" id="toggleAnnotationsBtn">Annotations: On</button>
        <button class="print-btn secondary" id="toggleDiagramsBtn">Piano Diagrams: On</button>
        <button class="print-btn secondary" id="toggleHeaderBtn">Header: On</button>
        <button class="print-btn secondary" onclick="window.close()">✕ Close</button>
    </div>

    <!-- Page Container -->
    <div class="page-container">
        <!-- Header -->
        <div class="score-header">
            <h1 class="score-title" id="scoreTitle" contenteditable="true">Piano Score</h1>
            <div class="score-metadata">
                <div class="metadata-left">
                    <div id="scoreComposer"></div>
                    <div id="scoreDate"></div>
                </div>
                <div class="metadata-center">
                    <div id="scoreKeySignature"></div>
                    <div id="scoreTimeSignature"></div>
                </div>
                <div class="metadata-right">
                    <div id="scoreTempo"></div>
                    <div id="scoreMeasureCount"></div>
                </div>
            </div>
        </div>

        <!-- Score Content -->
        <div class="score-content" id="scoreContent">
            <div class="message">Loading score...</div>
        </div>

        <!-- Footer -->
        <div class="score-footer">
            <div>Created with Piano Tour • <span id="printDate"></span></div>
        </div>
    </div>

    <script type="module">
        // Import necessary modules from existing codebase
        import { pianoState } from '/static/js/core/appState.js';
        import { drawAllPrint, displayChordName, setDisplayChordName, displayPianoDiagrams, setDisplayPianoDiagrams } from '/static/js/score/printRenderer.js';
        import { processAndSyncScore } from '/static/js/score/scoreWriter.js';

        // Load score data from localStorage
        function loadScoreData() {
            try {
                const savedScoreJSON = localStorage.getItem('autosavedScore');

                if (!savedScoreJSON) {
                    showError('No saved score found. Please create a score in the editor first.');
                    return null;
                }

                const savedData = JSON.parse(savedScoreJSON);

                // Handle both array format and object format
                const measures = Array.isArray(savedData) ? savedData : savedData.measures;

                if (!measures || !Array.isArray(measures) || measures.length === 0) {
                    showError('Score data is empty or invalid.');
                    return null;
                }

                return {
                    measures: measures,
                    keySignature: savedData.keySignature || 'C',
                    timeSignature: savedData.timeSignature || { numerator: 4, denominator: 4 },
                    tempo: savedData.tempo || 120,
                    title: savedData.title || 'Untitled',
                    composer: savedData.composer || '',
                    enableBeaming: savedData.enableBeaming !== false, // Default to true
                };
            } catch (error) {
                console.error('Error loading score:', error);
                showError('Failed to load score data: ' + error.message);
                return null;
            }
        }

        // Display metadata in header
        function displayMetadata(scoreData) {
            document.getElementById('scoreTitle').textContent = scoreData.title || 'Piano Score';

            if (scoreData.composer) {
                document.getElementById('scoreComposer').textContent = 'Composer: ' + scoreData.composer;
            }

            const keyDisplay = scoreData.keySignature || 'C Major';
            document.getElementById('scoreKeySignature').textContent = 'Key: ' + keyDisplay;

            const timeNumerator = scoreData.timeSignature?.numerator || 4;
            const timeDenominator = scoreData.timeSignature?.denominator || 4;
            document.getElementById('scoreTimeSignature').textContent = `Time: ${timeNumerator}/${timeDenominator}`;

            document.getElementById('scoreTempo').textContent = `♩ = ${scoreData.tempo || 120} BPM`;
            document.getElementById('scoreMeasureCount').textContent = `${scoreData.measures.length} measure${scoreData.measures.length !== 1 ? 's' : ''}`;

            const now = new Date();
            document.getElementById('printDate').textContent = now.toLocaleDateString();
        }

        // Show error message
        function showError(message) {
            const scoreContent = document.getElementById('scoreContent');
            scoreContent.innerHTML = `<div class="message error">${message}</div>`;
        }

        // Initialize on page load
        let loadedScoreData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🖨️ Print page loading...');

            const scoreData = loadScoreData();

            if (scoreData) {
                loadedScoreData = scoreData;

                // Update pianoState with loaded data
                pianoState.title = scoreData.title || '';
                pianoState.keySignature = scoreData.keySignature;
                pianoState.timeSignature = scoreData.timeSignature;
                pianoState.tempo = scoreData.tempo;
                pianoState.enableBeaming = scoreData.enableBeaming;

                // Process and sync the score data
                if (processAndSyncScore(scoreData.measures)) {
                    displayMetadata(scoreData);

                    // Render using the print renderer (which will use scoreRenderer under the hood)
                    try {
                        await drawAllPrint('scoreContent', scoreData.measures);
                        console.log('✅ Score rendered successfully');

                        // Optional: Auto-open print dialog after a short delay
                        // setTimeout(() => window.print(), 1000);
                    } catch (error) {
                        console.error('Error rendering score:', error);
                        showError('Failed to render score: ' + error.message);
                    }
                } else {
                    showError('Invalid score data format.');
                }
            }

            // Toggle annotations button
            const toggleBtn = document.getElementById('toggleAnnotationsBtn');
            toggleBtn.addEventListener('click', async () => {
                setDisplayChordName(!displayChordName);
                toggleBtn.textContent = displayChordName ? 'Annotations: On' : 'Annotations: Off';
                if (loadedScoreData) {
                    await drawAllPrint('scoreContent', loadedScoreData.measures);
                }
            });

            // Toggle piano diagrams button
            const toggleDiagramsBtn = document.getElementById('toggleDiagramsBtn');
            toggleDiagramsBtn.addEventListener('click', async () => {
                setDisplayPianoDiagrams(!displayPianoDiagrams);
                toggleDiagramsBtn.textContent = displayPianoDiagrams ? 'Piano Diagrams: On' : 'Piano Diagrams: Off';
                if (loadedScoreData) {
                    await drawAllPrint('scoreContent', loadedScoreData.measures);
                }
            });

            // Toggle header button
            const toggleHeaderBtn = document.getElementById('toggleHeaderBtn');
            let headerVisible = true;
            toggleHeaderBtn.addEventListener('click', () => {
                headerVisible = !headerVisible;
                document.querySelector('.score-header').style.display = headerVisible ? '' : 'none';
                toggleHeaderBtn.textContent = headerVisible ? 'Header: On' : 'Header: Off';
            });
        });
    </script>
</body>
</html>
