{% extends "index.html" %}

{% block title %}PianoTour - Interactive Piano Studio{% endblock %}

{% block toggles %}
    {% include 'partials/_toggles.html' %}
{% endblock %}

{% block scripts %}
<script type="module">
    import { pianoState } from '{{ url_for("static", filename="js/core/appState.js") }}';
    import { addBasicKeyboardListeners } from "{{ url_for('static', filename='js/ui/listenerManager.js') }}";

    // Use the route's instrument if it sets one; otherwise keep the saved choice from appState
    const templateInstrument = '{{ instrument }}';
    if (templateInstrument) {
        pianoState.instrument = templateInstrument;
    }

    console.log("Instrument:", pianoState.instrument);

    addBasicKeyboardListeners();

    // Wait for base init, then set up play-along.
    // Score interaction and the context menu are initialized by index.html for every page.
    function waitForBaseInit() {
        return new Promise((resolve) => {
            if (window.pianoTourInitState && window.pianoTourInitState.baseInitialized) {
                resolve();
            } else {
                document.addEventListener('pianoTourBaseReady', () => resolve(), { once: true });
            }
        });
    }

    async function initializeScoreFeatures() {
        try {
            await waitForBaseInit();

            // Initialize play-along mode
            const { initializePlayAlong } = await import('{{ url_for("static", filename="js/score/playAlongController.js") }}');
            initializePlayAlong();

            const { initializePlayAlongUI } = await import('{{ url_for("static", filename="js/ui/playAlongUI.js") }}');
            initializePlayAlongUI();
            console.log('play-along: Initialized');
        } catch (error) {
            console.error('play-along: Failed to initialize:', error);
        }
    }

    initializeScoreFeatures();
</script>
{% endblock %}
