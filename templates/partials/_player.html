<div class="playback-controls">
  <button
    id="play-score-btn"
    class="btn btn--primary playback-controls__button"
  >
    ▶ Play Score
  </button>

  <button id="stop-score-btn" class="btn btn--danger playback-controls__button">
    ⏹ Stop
  </button>

  <div class="dropdown-menu-container">
    <button id="playback-menu-btn" class="btn btn--info playback-controls__button">
      ☰ Menu
    </button>
    <div id="playback-menu-dropdown" class="dropdown-content hidden">
      <button id="settings-btn-menu" class="dropdown-item">
        ⚙ Settings
      </button>
      <div class="dropdown-submenu">
        <button id="instrument-menu-btn" class="dropdown-item has-submenu">
          🎵 Instrument ▸
        </button>
        <div id="instrument-submenu" class="submenu-content hidden">
          <button class="dropdown-item instrument-option" data-instrument="piano">🎹 Piano</button>
          <button class="dropdown-item instrument-option" data-instrument="guitar">🎸 Guitar</button>
          <button class="dropdown-item instrument-option" data-instrument="electric_guitar">⚡ Electric Guitar</button>
          <button class="dropdown-item instrument-option" data-instrument="bass">🎸 Bass</button>
          <button class="dropdown-item instrument-option" data-instrument="cello">🎻 Cello</button>
          <button class="dropdown-item instrument-option" data-instrument="violin">🎻 Violin</button>
          <button class="dropdown-item instrument-option" data-instrument="harp">🪕 Harp</button>
          <button class="dropdown-item instrument-option" data-instrument="sax">🎷 Saxophone</button>
          <button class="dropdown-item instrument-option" data-instrument="clarinet">🎼 Clarinet</button>
          <button class="dropdown-item instrument-option" data-instrument="french_horn">📯 French Horn</button>
        </div>
      </div>
      <button id="connect-midi-btn" class="dropdown-item">
        🎹 Connect MIDI
      </button>
      <button id="export-audio-btn" class="dropdown-item">
        📥 Export Audio
      </button>
      <a href="/print" class="dropdown-item">
        🖨 Print
      </a>
      <button id="load-score-btn" class="dropdown-item">
        📂 Load
      </button>
      <button id="save-score-btn" class="dropdown-item">
        💾 Save
      </button>
    </div>
  </div>
  
  <input
    type="file"
    id="load-file"
    style="display: none"
    accept=".json, .mid, .midi"
  />
<!--
<button id="show-side-panel-btn" class="btn btn--info playback-controls__button">
    Show Side Panel
</button>-->
</div>
